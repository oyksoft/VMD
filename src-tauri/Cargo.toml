[package]
name = "vmd"
version = "0.1.0"
edition = "2021"
description = "VMD - 一个轻量级的 Markdown 查看与编辑工具"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[profile.dev]
debug = 1
incremental = true
opt-level = 0

[profile.release]
opt-level = "z"           # size 优化（同等速度更小）
lto = "fat"               # 完全 LTO，跨模块优化
codegen-units = 1         # 单 codegen unit，体积更小
panic = "abort"           # 不要 unwinding 代码，减小体积
strip = "symbols"         # 去掉符号表
incremental = false       # release 不要增量

[profile.release.package."*"]
opt-level = "z"           # 依赖也用 size 优化
