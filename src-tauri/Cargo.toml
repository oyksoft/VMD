[package]
name = "vmd"
version = "0.2.9"
edition = "2021"
description = "VMD - 一个轻量级的 Markdown 查看与编辑工具"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# wry + compression 必须保留：compression 会用 brotli 压缩内嵌的前端资源
# （katex 字体 + mermaid 约 3.5MB，压缩后省下 2MB+）
tauri = { version = "2", default-features = false, features = ["wry", "compression", "custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
# #[implement(IDropTarget)] 宏展开后写死了 ::windows_core:: 路径，必须直接依赖
windows-core = "0.62"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
# 只开实际用到的两个模块，避免拉进整个 Win32 API（编译时间和体积都省）
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 1
incremental = true
opt-level = 0

[profile.release]
opt-level = "z"           # 体积优先（这个 App 是 I/O 密集，Rust 端性能无所谓）
lto = "fat"               # 完全链接时优化，跨 crate 消除冗余
codegen-units = 1         # 单编译单元，利于内联和去重
panic = "abort"           # 取消 unwind 展开表，省 3MB+（代价：panic 会终止进程）
strip = "symbols"         # 去掉符号表
incremental = false       # release 不做增量编译
debug = false
debug-assertions = false
overflow-checks = false
rpath = false             # Windows 上无用，去掉以免带入额外代码

[profile.release.package."*"]
opt-level = "z"           # 依赖也按体积优化
